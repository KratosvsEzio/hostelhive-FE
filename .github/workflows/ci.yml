name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # A green run takes about 15 minutes. Without a limit, a hung test worker held the job for
    # GitHub's 6-hour maximum on every run from f20b6e1 (#177) on; fail fast instead.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      # --with-deps: the runner lacks the system libraries WebKit needs (libgtk-4, libgraphene…),
      # so without it the webkit project fails before a test runs.
      - run: npx playwright install --with-deps

      # Lint enforces module boundaries; build runs AOT + bundle budgets.
      - run: npx nx run-many -t lint test build typecheck e2e
