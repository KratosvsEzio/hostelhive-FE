<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HostelHive</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F36E21" />

    <!--
      Fallbacks only. Every route overwrites these through `Seo` (core/seo.ts) once the app
      boots — a page that owns its head from its own effect, every other route from the
      route-level default in core/route-head.ts — and does so during SSR, so a crawler that
      never runs JavaScript still receives the real ones. What is left here is what a
      scraper reads from a client-rendered shell before the app has run.

      Deliberately no canonical, no og:url and no og:locale. They name one address and one
      language, so any static value is wrong on every page but one: a canonical here made
      each page that never replaced it declare itself a copy of the home page. Robots stays
      `index`, because a static `noindex` would de-index any page whose own head failed.
    -->
    <meta
      name="description"
      content="Search verified hostels, PGs and co-living. Filter by city, budget, gender and room sharing — no brokers, no surprises."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:site_name" content="HostelHive" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HostelHive — Find verified hostels" />
    <meta
      property="og:description"
      content="Search verified hostels, PGs and co-living. Filter by city, budget, gender and room sharing."
    />
    <meta property="og:image" content="https://hostelhive.com/hostelhive-logo.png" />

    <!--
      App deep links. Site-wide constants, so they live here rather than being rewritten
      per page. A shared HostelHive link opens the app for anyone who has it installed,
      and offers the install to anyone who does not.

      Android only for now: `ios/` has never been generated and there is no App Store id
      to point at, so the iOS equivalents would advertise an app that does not exist.
      Add `twitter:app:id:iphone` and `al:ios:app_store_id` when it ships.
    -->
    <meta name="twitter:app:name:googleplay" content="HostelHive" />
    <meta name="twitter:app:id:googleplay" content="com.hostelhive.app" />
    <meta property="al:android:package" content="com.hostelhive.app" />
    <meta property="al:android:app_name" content="HostelHive" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HostelHive — Find verified hostels" />
    <meta
      name="twitter:description"
      content="Search verified hostels, PGs and co-living."
    />
    <meta name="twitter:image" content="https://hostelhive.com/hostelhive-logo.png" />

    <!-- The photograph bucket, which every listing and every search result reads from.

         This one is not a guess: it is the host in `attachment.url` on the live payload, and
         the listing page's own `<link rel="preload" as="image">` already points at it. The
         hero is the Largest Contentful Paint element, so its request was paying a cold DNS +
         TCP + TLS handshake to an origin nothing had touched yet — the preload cannot start
         the transfer until that completes. Warming the connection costs one socket and buys
         the whole handshake back on the critical path.

         `crossorigin` because images are fetched anonymously; without it the browser opens a
         second connection and the warmed one goes unused. -->
    <link
      rel="preconnect"
      href="https://hostel-hive-images.s3.ap-south-1.amazonaws.com"
      crossorigin
    />

    <!-- The API: `API_URL` in the deploy's `.env`, compiled into `api.env.ts`. The first data
         request is on the critical path to Largest Contentful Paint on every page, and on the
         client-only console routes nothing server-rendered has warmed the connection.

         `use-credentials`, not a bare `crossorigin`: `authInterceptor` sends every API call
         with `withCredentials`, and browsers keep credentialed and anonymous sockets apart. An
         anonymous preconnect here would warm a socket no API request ever uses.

         Static because `index.html` is not templated. `tools/generate-api-env.mjs` warns at
         build time when a deployed (https) `API_URL` names a different origin, so a move to
         another API host cannot leave this pointing at one the app never calls. -->
    <link rel="preconnect" href="https://api.hostelhive.com" crossorigin="use-credentials" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Boot splash styles. Plain CSS, not Tailwind: this paints before any stylesheet the
         build produces has loaded. Mirrors the startup veil in app.html (surface ground,
         28px wordmark, 96px bee, 16px gap) so the hand-over is invisible. -->
    <style>
      #hh-boot {
        position: fixed;
        inset: 0;
        z-index: 210;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f5f5f5;
        transition: opacity 0.25s ease;
        /* Backstop: if the app never boots (a script error, a blocked bundle), get out of
           the way rather than cover a server-rendered page forever. */
        animation: hh-boot-cap 0s 10s forwards;
      }
      #hh-boot.hh-boot-out {
        opacity: 0;
        pointer-events: none;
      }
      /* The language is settled (see the script before #hh-boot): nothing to hide. */
      .hh-boot-skip #hh-boot {
        display: none;
      }
      @keyframes hh-boot-cap {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      #hh-boot .hh-boot-logo {
        display: block;
        height: 28px;
        width: auto;
      }
      #hh-boot .hh-boot-bee {
        display: grid;
        width: 96px;
        height: 96px;
      }
      #hh-boot .hh-boot-bee > * {
        grid-area: 1 / 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #hh-boot .hh-boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        #hh-boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // The splash hides the page only while the visitor's country may still change its
      // language, which navigates under whoever started reading. That cannot happen when they
      // chose a language before or the URL names one (and, for English, they were not
      // redirected here), so then the server-rendered page shows from the first paint.
      // Mirrors LocaleStore.languageSettled and LocaleSync.wasSentHere; the codes are
      // LOCALES in core/i18n/locales.ts (boot-splash-settled.spec.ts keeps them in step).
      (function () {
        var codes = ['en', 'ur', 'ar', 'hi', 'zh', 'ja', 'fr', 'de', 'es', 'it', 'nl', 'sv', 'da', 'hu', 'ru', 'id', 'vi', 'pl'];
        var first = location.pathname.split('/')[1];
        var redirected = false;
        try {
          var nav = performance.getEntriesByType('navigation')[0];
          redirected = !!nav && nav.redirectCount > 0;
        } catch (e) {}
        var named = codes.indexOf(first) >= 0 && !(first === 'en' && redirected);
        var chosen = null;
        try {
          chosen = localStorage.getItem('hh.locale.chosen');
        } catch (e) {}
        if (named || codes.indexOf(chosen) >= 0) {
          document.documentElement.classList.add('hh-boot-skip');
        }
      })();
    </script>
    <!-- Boot splash: a full page load whose language is not settled yet shows the bee flying
         in to wave hello while the app boots and works out who and where the visitor is. No
         magnifying glass here — nobody is searching yet; the glass belongs to the search states.
         Static HTML so it paints with the first byte, before any JavaScript; App lifts it once
         startup has resolved (app.ts). -->
    <div id="hh-boot" role="status" aria-live="polite">
      <img class="hh-boot-logo" src="/hostelhive-wordmark.svg" alt="HostelHive" width="224" height="28" />
      <div class="hh-boot-bee" aria-hidden="true"></div>
      <span class="hh-boot-sr">Loading…</span>
    </div>
    <script>
      // Picks the bee for this browser. Mirrors hh-mascot (shared/mascot/mascot.ts):
      // reduced motion gets the still pose; WebKit (which drops VP9's alpha) gets WebP.
      (function () {
        // A skipped splash is removed outright, so its bee never downloads.
        if (document.documentElement.classList.contains('hh-boot-skip')) {
          var boot = document.getElementById('hh-boot');
          if (boot) boot.remove();
          return;
        }
        var box = document.querySelector('#hh-boot .hh-boot-bee');
        if (!box) return;
        var ua = navigator.userAgent;
        var webkit = /iPhone|iPad|iPod/.test(ua) || (/AppleWebKit/.test(ua) && !/Chrome|Chromium|Edg\//.test(ua));
        var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        function image(src) {
          var img = new Image();
          img.alt = '';
          img.src = src;
          box.appendChild(img);
          return img;
        }
        if (still) return void image('/mascot/hover-still.webp');
        if (webkit) {
          var bee = image('/mascot/hello.webp');
          // An image has no 'ended': swap to the loop on the greeting's length, from its arrival.
          bee.onload = function () {
            bee.onload = null;
            setTimeout(function () { bee.src = '/mascot/hover.webp'; }, 1500);
          };
          return;
        }
        function video(src, loop) {
          var v = document.createElement('video');
          v.muted = true;
          v.defaultMuted = true;
          v.playsInline = true;
          v.setAttribute('muted', '');
          v.setAttribute('playsinline', '');
          v.preload = 'auto';
          v.loop = loop;
          v.src = src;
          box.appendChild(v);
          return v;
        }
        var hover = video('/mascot/hover.webm', true);
        hover.style.opacity = '0';
        var hello = video('/mascot/hello.webm', false);
        hello.addEventListener('ended', function () {
          hover.style.opacity = '1';
          hello.style.opacity = '0';
          var p = hover.play();
          if (p) p.catch(function () {});
        });
        var p = hello.play();
        if (p) p.catch(function () {});
      })();
    </script>
    <noscript><style>#hh-boot { display: none; }</style></noscript>
    <app-root></app-root>
  </body>
</html>
