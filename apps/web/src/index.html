<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HostelHive</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F36E21" />

    <!--
      Defaults only. Every public page overwrites these through `Seo` (core/seo.ts) with
      its own copy, and does so during SSR so a crawler that never runs JavaScript still
      receives them. They matter for the handful of routes that set nothing of their own,
      and as the fallback a social scraper reads if it grabs the shell before hydration.
    -->
    <meta
      name="description"
      content="Search verified hostels, PGs and co-living across Pakistan. Filter by city, budget, gender and room sharing — no brokers, no surprises."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://hostelhive.com/" />

    <meta property="og:site_name" content="HostelHive" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HostelHive — Find verified hostels in Pakistan" />
    <meta
      property="og:description"
      content="Search verified hostels, PGs and co-living across Pakistan. Filter by city, budget, gender and room sharing."
    />
    <meta property="og:url" content="https://hostelhive.com/" />
    <meta property="og:image" content="https://hostelhive.com/hostelhive-logo.png" />
    <meta property="og:locale" content="en_PK" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HostelHive — Find verified hostels in Pakistan" />
    <meta
      name="twitter:description"
      content="Search verified hostels, PGs and co-living across Pakistan."
    />
    <meta name="twitter:image" content="https://hostelhive.com/hostelhive-logo.png" />

    <!-- TODO: add `<link rel="preconnect" href="https://<api-host>" crossorigin>` once the
         production API hostname is known. It saves a DNS + TLS round trip on the first
         data request, which is on the critical path to Largest Contentful Paint — but
         only if the host is right. Pointing it at a host the app never contacts spends a
         connection for nothing, so it is left out rather than guessed. -->

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
