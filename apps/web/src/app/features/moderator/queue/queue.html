<app-dashboard-layout [label]="'moderatorQueue.reviewQueue' | transloco">
  <div class="mb-4 flex items-center justify-between gap-4">
    <hh-search
      class="w-full sm:w-72"
      [fieldOptions]="searchFieldOptions"
      [field]="searchField()"
      (fieldChange)="onSearchField($event)"
      (termChange)="onSearchTerm($event)"
    />
  </div>
  @let s = state();
  @if (s.loading) {
    <div class="overflow-hidden rounded-2xl bg-white shadow-card">
      @for (i of skeletons; track i) {
        <div
          class="flex items-center gap-3 border-b border-ink-100 px-5 py-3.5 last:border-0"
        >
          <hh-skeleton class="h-10 w-10" radius="md" />
          <div class="flex-1">
            <hh-skeleton class="h-4 w-1/3" />
            <hh-skeleton class="mt-2 h-3 w-1/5" />
          </div>
          <hh-skeleton class="h-7 w-16" radius="md" />
        </div>
      }
    </div>
  } @else if (s.error) {
    <div class="mt-2"><hh-error-state [networkError]="s.networkError" (retry)="retry()" /></div>
  } @else if (visible().length === 0) {
    <hh-empty-state
      icon="ti-inbox-off"
      [title]="'moderatorQueue.queueIsClear' | transloco"
      message="No submissions are waiting for review."
    />
  } @else {
    <hh-data-table
      minWidth="820px"
      [columns]="tableCols"
      [rows]="visible()"
      [rowId]="queueRowId"
      [sort]="queueSortState()"
      [pagination]="queuePaginationConf()"
      (sortChange)="onQueueSort($event)"
      [rowClickable]="true"
      (rowClick)="onQueueRowClick($event)"
      (pageChange)="page.set($event)"
    />
  }
</app-dashboard-layout>
