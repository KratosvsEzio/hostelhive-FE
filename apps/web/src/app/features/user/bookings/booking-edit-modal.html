<hh-confirm-modal
  size="md"
  icon="ti-edit"
  tone="info"
  [title]="'userBookings.editDetails' | transloco"
  [confirmLabel]="(saving() ? 'common.saving' : 'common.saveChanges') | transloco"
  [confirmColor]="'primary'"
  [confirmDisabled]="saving()"
  (confirm)="submit()"
  (cancel)="dismissed.emit()"
>
  <p class="text-sm text-ink-600">{{ 'userBookings.editDetailsHint' | transloco }}</p>

  <div class="mt-4 grid gap-3">
    <hh-input
      size="md"
      autocomplete="name"
      [label]="'common.fullName' | transloco"
      [(value)]="guestName"
      [error]="nameError() ? ('publicBooking.enterTheGuestName' | transloco) : ''"
    />
    <hh-phone-input
      [label]="'publicBooking.phone' | transloco"
      [(phone)]="guestPhone"
      [error]="phoneError() ? ('publicBooking.enterAValidPhone' | transloco) : ''"
    />
    <hh-input
      size="md"
      type="email"
      autocomplete="email"
      [label]="'publicBooking.email' | transloco"
      [(value)]="guestEmail"
      [error]="emailError() ? ('publicBooking.enterAValidEmail' | transloco) : ''"
    />
    <div>
      <label for="booking-edit-notes" class="mb-1 block text-xs font-medium text-ink-600">
        {{ 'publicBooking.notesForTheHostel' | transloco }}
      </label>
      <textarea
        #notesField
        id="booking-edit-notes"
        rows="3"
        class="block w-full resize-none rounded-xl border border-ink-200 bg-transparent px-3 py-2.5 text-sm text-ink-900 outline-none transition placeholder:text-ink-300 focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
        [attr.maxlength]="notesMax"
        [placeholder]="'publicBooking.notesPlaceholder' | transloco"
        [value]="notes()"
        (input)="notes.set(notesField.value)"
      ></textarea>
    </div>
  </div>

  @if (error()) {
    <p class="mt-3 flex items-start gap-2 rounded-xl bg-danger/5 px-3 py-2.5 text-xs font-medium text-danger" role="alert">
      <span class="ti ti-alert-circle mt-px shrink-0 text-sm" aria-hidden="true"></span>
      {{ error() }}
    </p>
  }
</hh-confirm-modal>
