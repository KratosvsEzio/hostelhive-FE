<div class="rounded-2xl border border-ink-100 bg-white p-6">
  <h2 class="text-lg font-semibold text-ink-900">Account settings</h2>
  <p class="mt-1 text-sm text-ink-400">Update your name, phone number and password.</p>

  <!-- Avatar -->
  <div class="mt-6 flex items-center gap-4">
    <div class="shrink-0">
      @if (avatarUrl()) {
        <img [src]="avatarUrl()" alt="Profile photo" class="h-16 w-16 rounded-full object-cover ring-2 ring-ink-100" />
      } @else {
        <span class="grid h-16 w-16 place-items-center rounded-full bg-ink-800 text-xl font-semibold text-white">AA</span>
      }
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button hh-button variant="outlined" size="sm" type="button" (click)="openCamera()">
        <i class="ti ti-camera"></i>Use camera
      </button>
      <button hh-button variant="outlined" size="sm" type="button" (click)="openFilePicker()">
        <i class="ti ti-photo"></i>Choose photo
      </button>
      @if (avatarUrl()) {
        <button hh-button variant="text" size="sm" type="button" (click)="removeAvatar()">
          Remove
        </button>
      }
    </div>
  </div>

  <!-- Hidden file inputs -->
  <input #cameraInput type="file" accept="image/*" capture="user" class="sr-only" (change)="onFileSelected($event)" />
  <input #fileInput type="file" accept="image/*" class="sr-only" (change)="onFileSelected($event)" />

  <!-- Profile fields -->
  <div class="mt-6 grid gap-4 sm:grid-cols-2">
    <label class="block">
      <span class="mb-1 block text-sm font-medium text-ink-700">Full name</span>
      <input class="hh-input" value="Aashir Azeem" />
    </label>
    <label class="block">
      <span class="mb-1 block text-sm font-medium text-ink-700">Phone number</span>
      <input class="hh-input" type="tel" value="+92 300 1234567" />
    </label>
  </div>

  <!-- Password -->
  <div class="mt-6 border-t border-ink-100 pt-5">
    <h3 class="text-base font-semibold text-ink-900">Change password</h3>
    <p class="mt-1 text-sm text-ink-400">Use at least 8 characters with a mix of letters and numbers.</p>
    <div class="mt-4 grid max-w-md gap-4">
      <label class="block">
        <span class="mb-1 block text-sm font-medium text-ink-700">Current password</span>
        <input class="hh-input" type="password" placeholder="Enter current password" />
      </label>
      <label class="block">
        <span class="mb-1 block text-sm font-medium text-ink-700">New password</span>
        <input class="hh-input" type="password" placeholder="New password" />
      </label>
      <label class="block">
        <span class="mb-1 block text-sm font-medium text-ink-700">Confirm new password</span>
        <input class="hh-input" type="password" placeholder="Re-enter new password" />
      </label>
    </div>
  </div>

  <!-- Save -->
  <div class="mt-6 flex items-center gap-3 border-t border-ink-100 pt-5">
    <button hh-button color="primary" type="button" (click)="save()">Save changes</button>
    @if (saved()) {
      <span class="text-sm font-medium text-ok">Saved ✓</span>
    }
  </div>
</div>
