<div class="space-y-6">
  <div class="rounded-2xl border border-ink-100 bg-white p-6">
    <h2 class="text-lg font-semibold text-ink-900">Change password</h2>
    <p class="mt-1 text-sm text-ink-400">
      Use at least 8 characters with a mix of letters and numbers.
    </p>
    <div class="mt-5 grid max-w-md gap-4">
      <label class="block">
        <span class="mb-1 block text-sm font-medium text-ink-700"
          >Current password</span
        >
        <input class="hh-input" type="password" value="••••••••" />
      </label>
      <label class="block">
        <span class="mb-1 block text-sm font-medium text-ink-700"
          >New password</span
        >
        <input class="hh-input" type="password" placeholder="New password" />
      </label>
      <label class="block">
        <span class="mb-1 block text-sm font-medium text-ink-700"
          >Confirm new password</span
        >
        <input
          class="hh-input"
          type="password"
          placeholder="Re-enter new password"
        />
      </label>
    </div>
    <div class="mt-5 flex items-center gap-3 border-t border-ink-100 pt-5">
      <button hh-button color="primary" type="button" (click)="save()">Update password</button>
      @if (saved()) {
        <span class="text-sm font-medium text-ok">Password updated ✓</span>
      }
    </div>
  </div>

  <div class="rounded-2xl border border-ink-100 bg-white p-6">
    <div class="flex items-center justify-between gap-4">
      <div>
        <h3 class="font-semibold text-ink-900">Two-factor authentication</h3>
        <p class="mt-1 text-sm text-ink-400">
          Require a one-time code on every new login.
        </p>
      </div>
      <button
        type="button"
        role="switch"
        [attr.aria-checked]="twoFa()"
        aria-label="Two-factor authentication"
        (click)="twoFa.set(!twoFa())"
        class="relative h-6 w-11 shrink-0 rounded-full transition"
        [class]="twoFa() ? 'bg-brand-500' : 'bg-ink-200'"
      >
        <span
          class="absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all"
          [class]="twoFa() ? 'left-[22px]' : 'left-0.5'"
        ></span>
      </button>
    </div>
  </div>

  <div class="rounded-2xl border border-ink-100 bg-white p-6">
    <h3 class="font-semibold text-ink-900">Active sessions</h3>
    <div class="mt-3 flex items-center gap-3 rounded-xl bg-ink-50 p-3">
      <span
        class="grid h-9 w-9 place-items-center rounded-full bg-white text-ink-500"
        ><i class="ti ti-device-laptop"></i
      ></span>
      <span class="flex-1 text-sm">
        <span class="block font-medium text-ink-800"
          >This device · Karachi</span
        >
        <span class="block text-xs text-ink-400">Chrome · active now</span>
      </span>
      <span
        class="rounded-full bg-ok/10 px-2 py-0.5 text-xs font-medium text-ok"
        >Current</span
      >
    </div>
    <button hh-button variant="text" size="sm" type="button" class="mt-3">
      Log out of all other devices
    </button>
  </div>
</div>
