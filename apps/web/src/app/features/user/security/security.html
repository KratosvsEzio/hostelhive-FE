<div class="space-y-6">
  <div class="rounded-2xl border border-ink-100 bg-white p-4 sm:p-6">
    <h2 class="text-lg font-semibold text-ink-900">{{ 'userSecurity.changePassword' | transloco }}</h2>
    <p class="mt-1 text-sm text-ink-400">
      {{ 'userSecurity.useAtLeast8Characters' | transloco }}
    </p>

    <div class="mt-5 grid max-w-md gap-4">
      <hh-input
        [label]="'userSecurity.currentPassword' | transloco"
        type="password"
        [placeholder]="'userSecurity.enterCurrentPassword' | transloco"
        autocomplete="current-password"
        [(value)]="currentPassword"
      />

      <hh-input
        [label]="'common.newPassword' | transloco"
        type="password"
        [placeholder]="'common.newPassword' | transloco"
        autocomplete="new-password"
        [(value)]="newPassword"
      />

      <hh-input
        [label]="'common.confirmNewPassword' | transloco"
        type="password"
        [placeholder]="'userSecurity.reEnterNewPassword' | transloco"
        autocomplete="new-password"
        [error]="mismatch() ? 'Passwords do not match.' : ''"
        [(value)]="confirmPassword"
      />
    </div>

    <div class="mt-5 flex flex-wrap items-center gap-3 border-t border-ink-100 pt-5">
      <button
        hh-button
        color="primary"
        class="w-full sm:w-auto"
        type="button"
        [disabled]="saving() || mismatch() || !currentPassword().length || newPassword().length < 8 || !confirmPassword().length"
        (click)="save()"
      >
        @if (saving()) {
          <i class="ti ti-loader-2 animate-spin text-sm"></i>
        }
        {{ 'userSecurity.updatePassword' | transloco }}
      </button>
    </div>
  </div>
</div>
