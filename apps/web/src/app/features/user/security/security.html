<div class="space-y-6">
  <div class="rounded-2xl border border-ink-100 bg-white p-6">
    <h2 class="text-lg font-semibold text-ink-900">Change password</h2>
    <p class="mt-1 text-sm text-ink-400">
      Use at least 8 characters with a mix of letters and numbers.
    </p>

    <div class="mt-5 grid max-w-md gap-4">
      <hh-input
        label="Current password"
        type="password"
        placeholder="Enter current password"
        autocomplete="current-password"
        [(value)]="currentPassword"
      />

      <hh-input
        label="New password"
        type="password"
        placeholder="New password"
        autocomplete="new-password"
        [(value)]="newPassword"
      />

      <hh-input
        label="Confirm new password"
        type="password"
        placeholder="Re-enter new password"
        autocomplete="new-password"
        [error]="mismatch() ? 'Passwords do not match.' : ''"
        [(value)]="confirmPassword"
      />
    </div>

    <div class="mt-5 flex items-center gap-3 border-t border-ink-100 pt-5">
      <button
        hh-button
        color="primary"
        type="button"
        [disabled]="saving() || mismatch()"
        (click)="save()"
      >
        @if (saving()) {
          <i class="ti ti-loader-2 animate-spin text-sm"></i>
        }
        Update password
      </button>
    </div>
  </div>
</div>
