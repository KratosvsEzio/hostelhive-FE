<div class="space-y-6">
  <div class="rounded-2xl border border-ink-100 bg-white p-6">
    <h2 class="text-lg font-semibold text-ink-900">Change password</h2>
    <p class="mt-1 text-sm text-ink-400">
      Use at least 8 characters with a mix of letters and numbers.
    </p>

    <div class="mt-5 grid max-w-md gap-4">
      <label class="block">
        <span class="mb-1 block text-sm font-medium text-ink-700">Current password</span>
        <input
          class="hh-input"
          type="password"
          placeholder="Enter current password"
          autocomplete="current-password"
          [value]="currentPassword()"
          (input)="currentPassword.set($any($event.target).value)"
        />
      </label>

      <label class="block">
        <span class="mb-1 block text-sm font-medium text-ink-700">New password</span>
        <input
          class="hh-input"
          type="password"
          placeholder="New password"
          autocomplete="new-password"
          [value]="newPassword()"
          (input)="newPassword.set($any($event.target).value)"
        />
      </label>

      <div>
        <label class="block">
          <span class="mb-1 block text-sm font-medium text-ink-700">Confirm new password</span>
          <input
            class="hh-input"
            type="password"
            placeholder="Re-enter new password"
            autocomplete="new-password"
            [value]="confirmPassword()"
            (input)="confirmPassword.set($any($event.target).value)"
          />
        </label>
        @if (mismatch()) {
          <p class="mt-1.5 text-xs text-danger">Passwords do not match.</p>
        }
      </div>
    </div>

    <div class="mt-5 flex items-center gap-3 border-t border-ink-100 pt-5">
      <button
        hh-button
        color="primary"
        type="button"
        [disabled]="saving() || mismatch()"
        (click)="save()"
      >
        @if (saving()) {
          <i class="ti ti-loader-2 animate-spin text-sm"></i>
        }
        Update password
      </button>
    </div>
  </div>
</div>
