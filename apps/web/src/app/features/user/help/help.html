<div class="space-y-6">
  <div class="rounded-2xl border border-ink-100 bg-white p-6">
    <h2 class="text-lg font-semibold text-ink-900">Frequently asked</h2>
    <div class="mt-2">
      @for (f of faqs; track f.q) {
        <details class="border-t border-ink-100 py-1 first:border-t-0">
          <summary
            class="flex cursor-pointer list-none items-center justify-between py-3 font-medium text-ink-800"
          >
            {{ f.q }}<i class="ti ti-chevron-down text-ink-400"></i>
          </summary>
          <p class="pb-3 text-sm leading-relaxed text-ink-500">{{ f.a }}</p>
        </details>
      }
    </div>
  </div>

  <div class="rounded-2xl border border-ink-100 bg-white p-6">
    <h3 class="font-semibold text-ink-900">Still need help?</h3>
    <p class="mt-1 text-sm text-ink-400">Our team replies within a day.</p>
    <div class="mt-4 flex flex-wrap gap-3">
      <a
        href="https://wa.me/923001234567"
        class="inline-flex items-center gap-2 rounded-xl bg-tint-green px-4 py-2.5 text-sm font-medium text-ink-800 hover:bg-tint-green/70"
        ><i class="ti ti-brand-whatsapp text-lg text-ok"></i>WhatsApp</a
      >
      <a
        href="mailto:support@hostelhive.com"
        class="inline-flex items-center gap-2 rounded-xl bg-tint-blue px-4 py-2.5 text-sm font-medium text-ink-800 hover:bg-tint-blue/70"
        ><i class="ti ti-mail text-lg text-brand-500"></i
        >support&#64;hostelhive.com</a
      >
      <a
        href="tel:+922100000000"
        class="inline-flex items-center gap-2 rounded-xl bg-ink-50 px-4 py-2.5 text-sm font-medium text-ink-800 hover:bg-ink-100"
        ><i class="ti ti-phone text-lg text-ink-500"></i>Call us</a
      >
    </div>
  </div>
</div>
