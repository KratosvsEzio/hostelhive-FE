<div class="rounded-2xl border border-ink-100 bg-white p-6">
  <h2 class="text-lg font-semibold text-ink-900">Notifications</h2>
  <p class="mt-1 text-sm text-ink-400">
    Choose what we email and message you about.
  </p>

  <div class="mt-4 divide-y divide-ink-100">
    @for (p of prefs(); track p.label; let i = $index) {
      <div class="flex items-center justify-between gap-4 py-4">
        <div>
          <p class="font-medium text-ink-800">{{ p.label }}</p>
          <p class="mt-0.5 text-sm text-ink-400">{{ p.desc }}</p>
        </div>
        <button
          type="button"
          role="switch"
          [attr.aria-checked]="p.on"
          [attr.aria-label]="p.label"
          (click)="toggle(i)"
          class="relative h-6 w-11 shrink-0 rounded-full transition"
          [class]="p.on ? 'bg-brand-500' : 'bg-ink-200'"
        >
          <span
            class="absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all"
            [class]="p.on ? 'left-[22px]' : 'left-0.5'"
          ></span>
        </button>
      </div>
    }
  </div>
</div>
