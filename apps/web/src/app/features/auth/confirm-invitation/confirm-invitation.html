<div class="grid min-h-screen place-items-center bg-white px-4 text-ink-800">
  <div
    class="w-full max-w-md rounded-3xl border border-ink-100 bg-white p-7 text-center shadow-pill"
  >
    <img src="/hostelhive-logo.png" alt="HostelHive" class="mx-auto h-6 w-auto" />

    @switch (phase()) {
      @case ('verifying') {
        <span
          class="mx-auto mt-6 grid h-12 w-12 place-items-center rounded-full bg-tint-sky text-brand-600"
        >
          <i
            class="ti ti-loader-2 animate-spin text-2xl"
            aria-hidden="true"
          ></i>
        </span>
        <h1 class="mt-4 font-display text-xl font-semibold text-ink-900">
          Confirming your account…
        </h1>
        <p class="mt-1 text-sm text-ink-500">
          Hang tight while we verify your email and sign you in.
        </p>
      }
      @case ('error') {
        <span
          class="mx-auto mt-6 grid h-12 w-12 place-items-center rounded-full bg-danger/10 text-danger"
        >
          <i class="ti ti-alert-triangle text-2xl" aria-hidden="true"></i>
        </span>
        <h1 class="mt-4 font-display text-xl font-semibold text-ink-900">
          Confirmation failed
        </h1>
        <p class="mt-1 text-sm text-ink-500">{{ message() }}</p>
        <div class="mt-5 space-y-3">
          <a
            hh-button
            color="primary"
            [routerLink]="['/auth']"
            [queryParams]="{ mode: 'login' }"
            class="w-full"
            >Go to log in</a
          >
          <a
            hh-button
            variant="text"
            size="sm"
            [routerLink]="['/']"
            class="w-full"
            >Back to home</a
          >
        </div>
      }
    }
  </div>
</div>
