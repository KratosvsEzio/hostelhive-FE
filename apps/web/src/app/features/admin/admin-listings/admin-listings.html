<hh-admin-shell heading="All listings">
  <!-- Scoped search + vertical divider + global filter button -->
  <div class="flex items-center">
    <hh-search
      class="w-full sm:w-80"
      [fieldOptions]="searchFieldOptions"
      [field]="searchField()"
      (fieldChange)="onSearchField($event)"
      [term]="searchTerm()"
      (termChange)="onSearchTerm($event)"
      placeholder="Search by hostel…"
      ariaLabel="Search listings by hostel"
    />
    <span class="mx-3 h-5 w-px shrink-0 bg-ink-200"></span>
    <hh-global-filter
      [groups]="filterGroups()"
      [(value)]="globalFilters"
      (apply)="applyGlobalFilters($event)"
    />
  </div>

  <!-- Stat cards — one per status aggregate from the API aggs. -->
  @if (aggs().length) {
    <div class="mt-5 mb-5 grid grid-cols-2 gap-3 sm:grid-cols-3">
      @for (a of aggs(); track a.slug) {
        <hh-card>
          <p class="text-xs text-ink-400">{{ a.name }}</p>
          <p class="mt-1 text-2xl font-semibold" [class]="aggTextClass(a.slug)">
            {{ a.count | number }}
          </p>
          <p class="mt-0.5 truncate text-xs text-ink-400">{{ aggSubline(a) }}</p>
        </hh-card>
      }
    </div>
  }

  @let s = state();
  @if (s.loading) {
    <hh-skeleton class="mt-4 h-80" radius="lg" />
  } @else if (s.error) {
    <div class="mt-4"><hh-error-state [networkError]="s.networkError" (retry)="retry()" /></div>
  } @else if (!s.data || s.data.items.length === 0) {
    <div class="mt-4">
      <hh-empty-state
        icon="ti-building-community"
        title="No listings found"
      >
        <button
          hh-button
          variant="outlined"
          size="sm"
          (click)="onSearchTerm(''); clearFilters()"
        >
          Show all
        </button>
      </hh-empty-state>
    </div>
  } @else {
    <hh-data-table
      minWidth="900px"
      [columns]="tableCols"
      [rows]="s.data.items"
      [rowId]="listingsRowId"
      [sort]="tableSortState()"
      [pagination]="listingsPaginationConf()"
      (sortChange)="onTableSort($event)"
      [rowClickable]="true"
      (rowClick)="onRowClick($event)"
      (pageChange)="goToPage($event)"
    />
  }
</hh-admin-shell>
