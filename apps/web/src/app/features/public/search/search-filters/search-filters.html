<div class="flex flex-1 min-w-0 items-center gap-2">
  <!-- Filters button — sized to match the dropdown pills. Badge is an absolute overlay. -->
  <div class="relative shrink-0">
    <button
      hh-button variant="outlined" size="sm"
      type="button"
      (click)="openModal()"
      [class.border-brand-500]="hasActiveFilters()"
      [class.bg-brand-50]="hasActiveFilters()"
      [class.text-brand-700]="hasActiveFilters()"
    >
      <i class="ti ti-adjustments-horizontal text-sm"></i>
      Filters
    </button>
    @if (activeFilterCount() > 0) {
      <span
        class="pointer-events-none absolute -right-1.5 -top-1.5 grid h-[18px] min-w-[18px] place-items-center rounded-full bg-brand-500 px-1 text-[10px] font-bold leading-none text-white"
        >{{ activeFilterCount() }}</span
      >
    }
  </div>

  <!-- AccommodationType quick-select pills -->
  @for (g of genderPills; track g.value) {
    <button
      hh-chip
      type="button"
      [active]="accommodationType() === g.value"
      (click)="toggleGender(g.value)"
    ><i class="ti ti-{{ g.icon }} text-[13px]"></i>{{ g.label }}</button>
  }

  <span class="h-5 w-px shrink-0 bg-ink-200"></span>

  <!-- Popular amenity quick-select pills -->
  @for (a of popularAmenities; track a.slug) {
    <button
      hh-chip
      type="button"
      [active]="amenities().includes(a.slug)"
      (click)="toggleQuickAmenity(a.slug)"
    ><i class="ti ti-{{ a.icon }} text-[13px]"></i>{{ a.label }}</button>
  }

  <!-- Sort — quick-access inline; maps to sort[created_at] / sort[starting_price] in the API layer.
       Pinned to the far right; panel opens right-aligned so it never clips. -->
  <hh-dropdown
    class="ml-auto shrink-0"
    align="right"
    [options]="sortOptions"
    placeholder="Sort"
    clearLabel="Recommended"
    [value]="sort() === 'recommended' ? null : sort()"
    (valueChange)="onSortChange($event)"
  />
</div>

<hh-search-filter-modal [(open)]="modalOpen" (applied)="onApply($event)" />
