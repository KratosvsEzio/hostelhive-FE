<div class="flex min-h-screen flex-col bg-surface text-ink-800">
  @if (showHeader()) {
    <app-site-header />
  }
  <!-- Clears the fixed bottom tab bar. Derived from --hh-tabbar-h + the device inset
       rather than a fixed pb-*, so it stays correct when the bar grows on a
       gesture-nav device (see .hh-pb-tabbar in global.css). -->
  <main class="flex-1" [class.hh-pb-tabbar]="showTabBarClearance()"><router-outlet /></main>
  @if (showFooter()) {
    <!-- `hidden md:block` mirrors showFooter()'s width half in CSS. The server can't
         know the viewport, so it always renders the footer; without this the ~650px
         footer paints on a phone and is then torn out once hydration flips isMobile. -->
    <app-site-footer class="hidden md:block" />
  }
</div>
@if (showSeekerTabs()) {
  <app-seeker-tab-bar />
}

<!-- App-wide toasts (API failures, etc.) — floats above all chrome, every route. -->
<app-toast-host />
@if (showConsentBanner()) {
  <hh-consent-banner />
}
<!-- TEMPORARY (testing): startup gate to set the BE base URL. Remove before go-live. -->
<hh-dev-setup-gate />

<!-- Startup veil. Up while the session and the country are still being resolved: the country
     decides the language, and switching language navigates — so without this the page becomes
     readable and is then moved to /de/… underneath whoever started reading it. Self-releases
     on a cap inside StartupGate, so a hung third-party lookup cannot strand anyone here. -->
@if (startingUp()) {
  <div
    class="fixed inset-0 z-[200] grid place-items-center bg-surface"
    role="status"
    aria-live="polite"
  >
    <div class="flex flex-col items-center gap-4">
      <img src="/hostelhive-logo.png" alt="HostelHive" class="h-7 w-auto" />
      <i class="ti ti-loader-2 animate-spin text-2xl text-brand-500" aria-hidden="true"></i>
      <span class="sr-only">{{ 'common.loading' | transloco }}</span>
    </div>
  </div>
}
