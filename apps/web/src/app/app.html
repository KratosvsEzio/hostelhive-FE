<div class="flex min-h-screen flex-col bg-surface text-ink-800">
  @if (showHeader()) {
    <app-site-header />
  }
  <!-- pb clears the fixed bottom tab bar on the mobile app -->
  <main class="flex-1" [class.pb-20]="showSeekerTabs()"><router-outlet /></main>
  @if (showFooter()) {
    <app-site-footer />
  }
</div>
@if (showSeekerTabs()) {
  <app-seeker-tab-bar />
}
<!-- App-wide toasts (API failures, etc.) — floats above all chrome, every route. -->
<app-toast-host />
