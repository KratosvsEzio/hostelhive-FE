<aside
  class="fixed bottom-0 left-0 top-16 z-40 flex w-64 flex-col border-r border-ink-100 bg-white lg:flex"
  [class.hidden]="!drawer.open()"
>
  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-3">
    @for (item of nav(); track $index) {
      @if (item.divider) {
        <div class="my-2 border-t border-ink-100"></div>
      } @else {
        <a
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          class="nav-link"
          (click)="drawer.close()"
        >
          <i class="ti text-lg" [class]="item.icon"></i>{{ item.label }}
        </a>
      }
    }
  </nav>

  <!-- Property picker -->
  <div class="border-t border-ink-100 px-3 py-2">
    <p class="mb-1 px-2 text-[10px] font-semibold uppercase tracking-widest text-ink-400">Property</p>
    <hh-dropdown
      variant="borderless"
      placeholder="Loading…"
      triggerIcon="ti-building-community"
      [openRight]="true"
      [options]="propertyDropdownOptions()"
      [value]="propertyStore.selected()"
      [loading]="propertiesLoading()"
      (valueChange)="onPropertySelect($event)"
    />
    <a hh-button color="primary" routerLink="/host/hostels/new" class="mt-1 w-full">
      <i class="ti ti-plus"></i>
      Create new hostel
    </a>
  </div>
</aside>

@if (drawer.open()) {
  <button
    type="button"
    class="fixed inset-0 z-30 bg-ink-900/40 lg:hidden"
    aria-label="Close menu"
    (click)="drawer.close()"
  ></button>
}

<div class="h-[calc(100dvh-4rem)] overflow-hidden lg:pl-64">
  <router-outlet />
</div>
