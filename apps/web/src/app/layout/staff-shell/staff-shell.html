<aside
  class="group fixed bottom-0 start-0 hh-below-header z-40 flex flex-col border-r border-ink-100 bg-white transition-[transform,width] duration-200 ease-in-out"
  [style.width]="drawer.width_()"
>
  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-3">
    @for (item of nav(); track $index) {
      @if (item.divider) {
        <div class="my-2 border-t border-ink-100"></div>
      } @else {
        <a
          [routerLink]="item.link"
          routerLinkActive="active"
          class="nav-link"
          [class.nav-link--rail]="drawer.railed()"
          [hhTooltip]="drawer.railed() ? (item.label ?? '') : ''"
          hhTooltipPlacement="right"
          [attr.aria-label]="drawer.railed() ? item.label : null"
        >
          <i class="ti text-lg" [class]="item.icon"></i>
          @if (!drawer.railed()) {
            {{ item.label }}
          }
        </a>
      }
    }
  </nav>
  <!-- In the rail the avatar carries the identity on its own; the name and role need width
       the rail does not have, and the disc is already the thing people look for. -->
  <div class="border-t border-ink-100" [class.p-3]="!drawer.railed()" [class.p-2]="drawer.railed()">
    <div
      class="flex items-center rounded-xl"
      [class.gap-3]="!drawer.railed()"
      [class.p-2]="!drawer.railed()"
      [class.justify-center]="drawer.railed()"
    >
      <span
        class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-ink-800 text-sm font-semibold text-white"
        [hhTooltip]="drawer.railed() ? (user()?.name ?? '') : ''"
        hhTooltipPlacement="right"
        >{{ initials() }}</span
      >
      @if (!drawer.railed()) {
        <div class="min-w-0">
          <p class="truncate text-sm font-medium text-ink-900">
            {{ user()?.name }}
          </p>
          <p class="truncate text-xs text-ink-400">
            {{ user()?.email }}
          </p>
          <p class="truncate text-xs capitalize text-ink-400">
            {{ roleLabel() }}
          </p>
        </div>
      }
    </div>
  </div>

  <!-- The collapse handle, straddling the sidebar's edge.
       Hidden until the sidebar is hovered, because it is chrome rather than navigation and
       a permanently visible control competes with the ten it sits beside. Reachable by
       keyboard regardless — `focus-visible` shows it, or it would be a control only a
       mouse could ever find.
       `pointer-events` follow the same rule: invisible but clickable, it would sit over the
       page swallowing clicks meant for the content behind it. Hover propagates up the DOM
       rather than by geometry, so the handle keeps the group hovered even though half of it
       hangs outside the sidebar's box. -->
  <button
    type="button"
    class="pointer-events-none absolute top-1/2 z-10 grid h-6 w-6 -translate-y-1/2 place-items-center rounded-full border border-ink-200 bg-white text-ink-500 opacity-0 shadow-pill transition hover:border-brand-400 hover:text-brand-600 focus-visible:pointer-events-auto focus-visible:opacity-100 group-hover:pointer-events-auto group-hover:opacity-100"
    style="inset-inline-end: -12px"
    [attr.aria-label]="drawer.railed() ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.aria-expanded]="!drawer.railed()"
    (click)="drawer.toggleRail()"
  >
    <i
      class="ti text-sm"
      [class.ti-chevron-right]="drawer.railed()"
      [class.ti-chevron-left]="!drawer.railed()"
    ></i>
  </button>

  <!-- The brand edge, on hover.
       An overlay strip rather than thickening `border-r`: going from 1px to 2px would move
       every child one pixel left, so the whole sidebar would twitch as the pointer crossed
       it. -->
  <span
    class="pointer-events-none absolute inset-y-0 end-0 w-0.5 bg-brand-500 opacity-0 transition-opacity group-hover:opacity-100"
    aria-hidden="true"
  ></span>
</aside>

<div
  class="hh-viewport-below-header overflow-hidden transition-[padding-left] duration-200 ease-in-out"
  [style.paddingLeft]="contentPadding()"
>
  <router-outlet />
</div>
