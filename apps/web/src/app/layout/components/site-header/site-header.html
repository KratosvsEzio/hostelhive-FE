<header
  class="safe-pt sticky top-0 z-50 border-b border-ink-100 bg-white/95 backdrop-blur transition-[margin] duration-200 ease-in-out"
  [style.marginInlineStart]="sidebarInset()"
>
  <div class="px-5 sm:px-8">
    <!-- Row 1: logo + inline location search (home/search only) + route actions -->
    <div
      class="flex flex-wrap items-center justify-between gap-x-4 xl:flex-nowrap"
      [class.h-16]="!showSearchBar()"
      [class.py-2.5]="showSearchBar()"
    >
      <!-- The mark, unless the sidebar beside this bar is already showing it: on a console
           the brand sits in the sidebar's top row, at the true top-left of the window, and a
           second one here would be the same logo twice on one screen. The empty div stays so
           `justify-between` still pushes the controls to the end. -->
      <div class="flex items-center gap-2.5">
        @if (!hasConsoleSidebar()) {
          <a [routerLink]="homeLink()" class="flex shrink-0 items-center">
            <i hhLogo class="h-5 w-auto text-ink-900 sm:h-7"></i>
          </a>
          @if (area() === 'admin' || area() === 'moderator') {
            <span
              class="rounded px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-white"
              [class]="area() === 'admin' ? 'bg-brand-500' : 'bg-ink-900'"
              >{{ area() === 'admin' ? 'Admin' : 'Mod' }}</span
            >
          }
        }
      </div>

      @if (showSearchBar()) {
        <div class="hidden min-w-0 justify-center md:flex md:order-last md:basis-full md:pb-1 xl:order-none xl:basis-auto xl:flex-1 xl:px-4 xl:pb-0">
          <app-search-bar />
        </div>
      }

      <div class="flex shrink-0 items-center gap-3">
        <!-- Nothing role-specific out here. Both the host CTA and the way back out of a
             console live in the account menu now: the bar keeps only the controls that
             belong to nobody in particular — language, the bell, the avatar.

             The three cases this replaced were identical, and all three labelled a link to
             `/` "Switch to hosting" while their own aria-label said "View site". It went to
             the public site. A host already in the console read it as the way further in. -->
        <!-- Sits before the account menu: a visitor who cannot read the page needs this
             before anything else in the header. -->
        <hh-language-switcher class="hidden sm:block" />
        @if (isAuthenticated()) {
          <app-notification-bell />
        }
        <app-account-menu />
      </div>
    </div>
  </div>
</header>
